[project]
name = "osrd-ops-intelligence"
version = "0.1.0"
description = "Advisory railway operations intelligence for OSRD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
osrd-ops-api = "osrd_ops_intelligence.api:run"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osrd_ops_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
