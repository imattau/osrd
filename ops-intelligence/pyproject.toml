[project]
name = "osrd-ops-intelligence"
version = "0.1.0"
description = "Advisory railway operations intelligence for OSRD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1,<2",
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
]
rail-data = [
  "numpy>=2,<3",
  "pyarrow>=22,<27",
]

[project.scripts]
osrd-ops-api = "osrd_ops_intelligence.service.app:run"
osrd-replay-collect = "osrd_ops_intelligence.training.replay:main"
osrd-overlap-baseline = "osrd_ops_intelligence.training.overlap_baseline:main"
osrd-replay-train = "osrd_ops_intelligence.training.train_replay:main"
osrd-ride-fetch-core = "osrd_ops_intelligence.training.ride_core:main"
osrd-ride-baseline = "osrd_ops_intelligence.training.ride_baseline:main"
osrd-plan-ranker-data = "osrd_ops_intelligence.training.plan_ranker_data:main"
osrd-plan-ranker-train = "osrd_ops_intelligence.training.train_plan_ranker:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osrd_ops_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
